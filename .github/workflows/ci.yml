name: CI
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # Type-check the Edge Function and run the money-logic tests
      # (split shares, net balances, greedy settle-up). No network needed.
      - run: deno check supabase/functions/api/index.ts
      - run: deno test supabase/functions/api/index.test.ts
