<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>shareware — split expenses</title>
<!-- Installable icon set. All three PNGs are rasterised from the same #swMark
     path below, so the home-screen icon can't drift from the in-app logo.
     Relative paths: this ships to a domain root and to a /repo/ project page.
     - icon-*.png "any"     -> launcher/desktop, rounded tile with alpha corners
     - icon-maskable-*.png  -> Android crops "maskable" icons, so it is a full
       bleed square with the mark inside the centre 80% safe zone
     - apple-touch-icon.png -> iOS ignores alpha (transparent corners composite
       to BLACK) and applies its own squircle, so it is an opaque square -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="shareware">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- matches --bg per theme so the browser chrome blends into the sticky header;
     the manifest's single theme_color can't be media-queried, these can -->
<meta name="theme-color" content="#f6f7fb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e0f14" media="(prefers-color-scheme: dark)">
<link rel="icon" href='data:image/svg+xml,%3Csvg%20xmlns="http://www.w3.org/2000/svg"%20viewBox="0%200%2064%2064"%3E%3Cdefs%3E%3ClinearGradient%20id="g"%20x1="0"%20y1="0"%20x2="64"%20y2="64"%20gradientUnits="userSpaceOnUse"%3E%3Cstop%20offset="0"%20stop-color="%236d5efc"/%3E%3Cstop%20offset="1"%20stop-color="%239b6dff"/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20width="64"%20height="64"%20rx="15"%20fill="url%28%23g%29"/%3E%3Cpath%20d="M40.7%2017A10%2010%200%201%200%2032%2032A10%2010%200%201%201%2023.3%2047"%20fill="none"%20stroke="%23fff"%20stroke-width="8"%20stroke-linecap="round"/%3E%3Crect%20x="-8"%20y="29.6"%20width="80"%20height="4.8"%20fill="url%28%23g%29"%20transform="rotate%28-25%2032%2032%29"/%3E%3C/svg%3E'>
<style>
  :root{
    --bg:#f6f7fb; --card:#ffffff; --text:#141726; --muted:#6b7280;
    --border:#eceef3; --accent:#6d5efc; --accent2:#9b6dff;
    --pos:#12a150; --pos-bg:#e6f6ec; --neg:#e5484d; --neg-bg:#fdecec;
    --shadow:0 1px 2px rgba(20,23,38,.04),0 8px 24px rgba(20,23,38,.06);
    --radius:16px;
  }
  :root[data-theme="dark"]{
    --bg:#0e0f14; --card:#171922; --text:#e8e9ee; --muted:#9aa0ae;
    --border:#232634; --accent:#7d6dff; --accent2:#a985ff;
    --pos:#3fd07f; --pos-bg:#12281c; --neg:#ff6b6f; --neg-bg:#2a1517;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px rgba(0,0,0,.35);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#0e0f14; --card:#171922; --text:#e8e9ee; --muted:#9aa0ae;
      --border:#232634; --accent:#7d6dff; --accent2:#a985ff;
      --pos:#3fd07f; --pos-bg:#12281c; --neg:#ff6b6f; --neg-bg:#2a1517;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
  .wrap{max-width:760px;margin:0 auto;padding:0 16px 120px}
  a{color:var(--accent)}
  button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
  select,input{font:inherit;color:var(--text)}

  /* Header */
  header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 86%,transparent);
    backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
  .hbar{max-width:760px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.02em;font-size:18px}
  /* sizing + glow only -- the tile, gradient and mark all live in the SVG */
  .logo{width:30px;height:30px;border-radius:9px;flex:none;box-shadow:0 4px 12px rgba(109,94,252,.4)}
  .logo svg{width:100%;height:100%;display:block}
  .spacer{flex:1}
  .pill{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--border);
    border-radius:999px;padding:6px 10px;box-shadow:var(--shadow)}
  .pill select{border:0;background:none;outline:none;font-weight:600;max-width:130px}
  .icon-btn{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;
    background:var(--card);border:1px solid var(--border);box-shadow:var(--shadow);font-size:16px;transition:transform .15s}
  .icon-btn:active{transform:scale(.92)}

  /* Side menu. App-level chrome lives here, deliberately NOT in .tabs --
     Expenses / Balances / Settle up are three views of one group, and mixing
     "log out" into that row makes it mean two different things. */
  .drawer{position:fixed;top:0;left:0;bottom:0;width:300px;max-width:84vw;z-index:50;
    background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;
    overflow:auto;transform:translateX(-101%);transition:transform .25s cubic-bezier(.2,.8,.2,1);
    box-shadow:0 0 40px rgba(0,0,0,.25)}
  .drawer.open{transform:none}
  .dscrim{position:fixed;inset:0;background:rgba(10,10,20,.5);backdrop-filter:blur(3px);z-index:45;
    opacity:0;pointer-events:none;transition:opacity .2s}
  .dscrim.open{opacity:1;pointer-events:auto}
  .dhead{display:flex;align-items:center;gap:12px;width:100%;text-align:left;
    padding:20px 18px;border-bottom:1px solid var(--border)}
  .dhead .t{font-size:15.5px}
  .ditem{display:flex;align-items:center;gap:13px;width:100%;text-align:left;
    padding:14px 18px;font-weight:650;transition:.15s}
  .ditem:hover{background:var(--bg)}
  .ditem .di{font-size:18px;width:24px;text-align:center;flex:none}
  .ditem .t,.ditem .m,.dhead .t,.dhead .m{display:block}
  .ditem .m{font-weight:500}
  .dfoot{margin-top:auto;border-top:1px solid var(--border)}

  /* Hero */
  .hero{margin:20px 0;padding:22px;border-radius:22px;color:#fff;position:relative;overflow:hidden;
    background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 12px 30px rgba(109,94,252,.35)}
  .hero::after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;
    background:rgba(255,255,255,.12)}
  .hero .who{font-size:13px;opacity:.85;display:flex;align-items:center;gap:8px}
  .hero .amt{font-size:40px;font-weight:850;letter-spacing:-.03em;margin:6px 0 2px}
  .hero .sub{font-size:13px;opacity:.9}
  .hero .stats{display:flex;gap:22px;margin-top:16px;position:relative;z-index:1}
  .hero .stats div span{display:block;font-size:12px;opacity:.85}
  .hero .stats div b{font-size:17px;font-weight:750}

  /* Tabs */
  .tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--border);border-radius:14px;
    padding:5px;box-shadow:var(--shadow);position:sticky;top:64px;z-index:10}
  .tabs button{flex:1;padding:9px;border-radius:10px;font-weight:650;color:var(--muted);transition:.18s}
  .tabs button.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 4px 12px rgba(109,94,252,.35)}

  section{margin-top:16px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
  .row{display:flex;align-items:center;gap:12px;padding:14px 16px}
  .row+.row{border-top:1px solid var(--border)}
  .av{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:750;flex:none;font-size:14px}
  /* emoji avatar: neutral tile so the emoji's own colours carry it */
  .av.emoji{background:var(--border);font-size:22px;font-weight:400;line-height:1}

  /* emoji picker */
  .emoji-grid{display:flex;flex-wrap:wrap;gap:6px;max-height:136px;overflow:auto;
    background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:8px}
  .ebtn{width:36px;height:36px;border-radius:9px;font-size:19px;line-height:1;
    display:grid;place-items:center;transition:.12s}
  .ebtn:hover{background:var(--border)}
  .ebtn.on{background:var(--accent);box-shadow:0 3px 10px rgba(109,94,252,.45)}
  .ebtn.none{font-size:12.5px;font-weight:750;color:var(--muted)}
  .ebtn.none.on{color:#fff}
  .grow{flex:1;min-width:0}
  .grow .t{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .grow .m{font-size:12.5px;color:var(--muted)}
  .chip{font-weight:750;font-size:14px;padding:5px 10px;border-radius:999px;white-space:nowrap}
  .chip.pos{color:var(--pos);background:var(--pos-bg)} .chip.neg{color:var(--neg);background:var(--neg-bg)}
  .chip.zero{color:var(--muted);background:var(--border)}
  .amt-lg{font-weight:800;font-size:16px;letter-spacing:-.01em}

  .sec-head{display:flex;align-items:center;justify-content:space-between;margin:20px 4px 8px}
  .sec-head h2{font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0}
  .link-btn{color:var(--accent);font-weight:650;font-size:13px}

  .del{opacity:.5;font-size:15px;padding:6px;border-radius:8px;transition:.15s}
  .del:hover{opacity:1;background:var(--neg-bg);color:var(--neg)}
  /* compact row actions (rename / remove) -- deliberately quiet next to the
     balance chip, so the amount stays the loudest thing in the row */
  .mini{opacity:.4;padding:5px;border-radius:7px;transition:.15s;flex:none;
    display:inline-flex;color:var(--muted)}
  .mini svg{width:13px;height:13px;display:block}
  .mini:hover{opacity:1;background:var(--neg-bg);color:var(--neg)}
  .mini.edit:hover{background:var(--border);color:var(--accent)}

  /* Budget meter -- a battery-style fill. Colour is the signal, so it also
     carries a text percentage for anyone who can't rely on hue alone. */
  .budget{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:13px 16px;margin-top:12px;cursor:pointer}
  .budget+.budget{margin-top:8px}
  .budget .bhead{display:flex;align-items:baseline;gap:8px;margin-bottom:9px}
  .budget .blabel{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:650}
  .budget .bpct{margin-left:auto;font-weight:800;font-size:13px}
  .budget .bnum{font-size:12.5px;color:var(--muted)}
  .track{height:9px;border-radius:999px;background:var(--border);overflow:hidden}
  .fill{height:100%;border-radius:999px;transition:width .45s cubic-bezier(.2,.8,.2,1)}
  .fill.ok{background:linear-gradient(90deg,var(--pos),#4fd693)}
  .fill.warn{background:linear-gradient(90deg,#f5a623,#ffc55c)}
  .fill.over{background:linear-gradient(90deg,var(--neg),#ff8a8d)}
  .bpct.ok{color:var(--pos)} .bpct.warn{color:#f5a623} .bpct.over{color:var(--neg)}
  .budget.unset{border-style:dashed;text-align:center;color:var(--muted);font-size:13px;font-weight:600}

  /* Monthly money -- a destination, so the group's chrome gets out of the way */
  body.screen-monthly #hero,body.screen-monthly #budgets,body.screen-monthly .tabs{display:none}
  .vhead{display:flex;align-items:center;gap:11px;margin:18px 0 6px}
  .vhead h1{font-size:21px;margin:0;letter-spacing:-.02em}
  .back{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none;
    background:var(--card);border:1px solid var(--border);box-shadow:var(--shadow);
    font-size:19px;font-weight:800;line-height:1;color:var(--muted);transition:.15s}
  .back:hover{color:var(--text)}
  .pmbar{display:flex;align-items:center;gap:8px}
  .pmbar input{flex:1;min-width:0;padding:10px 12px;border:1px solid var(--border);border-radius:12px;
    background:var(--card);outline:none;font-weight:650;box-shadow:var(--shadow)}

  .mets{display:grid;grid-template-columns:repeat(auto-fit,minmax(98px,1fr));gap:8px;margin-top:12px}
  .met{background:var(--card);border:1px solid var(--border);border-radius:13px;
    padding:10px 12px;box-shadow:var(--shadow)}
  .met .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:750}
  .met .v{font-weight:800;font-size:16.5px;letter-spacing:-.01em;margin-top:3px}

  .nudge{display:flex;gap:10px;align-items:flex-start;margin-top:12px;padding:13px 15px;
    border-radius:14px;font-size:13.5px;line-height:1.45;font-weight:600;
    background:var(--card);border:1px solid var(--border);box-shadow:var(--shadow)}
  .nudge.up{background:var(--neg-bg);border-color:var(--neg);color:var(--neg)}
  .nudge.down{background:var(--pos-bg);border-color:var(--pos);color:var(--pos)}

  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .cal .dow{text-align:center;font-size:11px;font-weight:750;color:var(--muted);padding:2px 0 4px}
  .cday{aspect-ratio:1;border-radius:9px;border:1px solid var(--border);position:relative;
    display:grid;place-items:center;font-size:13px;font-weight:650;transition:.15s}
  .cday:hover{border-color:var(--accent)}
  .cday.blank{border:0;pointer-events:none}
  .cday.today{border-color:var(--accent);border-width:2px}
  .cday.sel{outline:2px solid var(--accent);outline-offset:1px}
  .cday .dot{position:absolute;bottom:4px;width:5px;height:5px;border-radius:50%;background:var(--pos)}
  .callegend{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:11.5px;color:var(--muted)}
  /* the swatch is its own thing -- .cday .dot is positioned inside a day cell */
  .callegend .dot{width:6px;height:6px;border-radius:50%;background:var(--pos);flex:none}
  .callegend .ramp{width:54px;height:8px;border-radius:999px;display:inline-block;
    background:linear-gradient(90deg,color-mix(in srgb,var(--neg) 16%,transparent),var(--neg))}
  .daysep{display:flex;justify-content:space-between;gap:10px;padding:8px 16px;
    background:var(--bg);font-size:11.5px;font-weight:750;color:var(--muted);
    text-transform:uppercase;letter-spacing:.05em}
  .daysep+.row{border-top:0}

  .settle-row .arrow{color:var(--muted);font-weight:800}
  .btn{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:700;
    padding:9px 14px;border-radius:11px;box-shadow:0 4px 12px rgba(109,94,252,.35);transition:transform .15s;
    text-decoration:none;display:inline-flex;align-items:center}
  .btn:active{transform:scale(.96)} .btn.sm{padding:7px 12px;font-size:13px}
  .btn.ghost{background:var(--card);border:1px solid var(--border);color:var(--text);box-shadow:var(--shadow)}

  .empty{text-align:center;color:var(--muted);padding:44px 20px}
  .empty .big{font-size:34px;margin-bottom:8px}

  /* FAB */
  .fab{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;z-index:30;
    background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:750;
    padding:15px 24px;border-radius:999px;box-shadow:0 10px 26px rgba(109,94,252,.5);display:flex;gap:8px;align-items:center;font-size:15px;transition:transform .18s}
  .fab:active{transform:translateX(-50%) scale(.94)}

  /* Modal */
  .scrim{position:fixed;inset:0;background:rgba(10,10,20,.5);backdrop-filter:blur(3px);z-index:40;
    display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
  .scrim.open{opacity:1;pointer-events:auto}
  .sheet{background:var(--card);width:100%;max-width:760px;border-radius:24px 24px 0 0;padding:22px 20px 28px;
    transform:translateY(24px);transition:transform .25s cubic-bezier(.2,.8,.2,1);max-height:92vh;overflow:auto}
  .scrim.open .sheet{transform:translateY(0)}
  @media(min-width:600px){.scrim{align-items:center}.sheet{border-radius:24px;transform:translateY(30px) scale(.98)}}
  .sheet h3{margin:0 0 16px;font-size:19px;letter-spacing:-.01em}
  .field{margin-bottom:14px} .field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px;font-weight:600}
  .field input,.field select{width:100%;padding:12px 13px;border:1px solid var(--border);border-radius:12px;
    background:var(--bg);outline:none;transition:.15s}
  .field input:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(109,94,252,.15)}
  .seg{display:flex;gap:6px;background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:4px}
  .seg button{flex:1;padding:8px;border-radius:9px;font-size:13px;font-weight:650;color:var(--muted)}
  .seg button.on{background:var(--card);color:var(--text);box-shadow:var(--shadow)}
  .parts{display:flex;flex-direction:column;gap:8px;max-height:210px;overflow:auto}
  .part{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--border);border-radius:11px}
  .part input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
  .part .grow{font-weight:600} .part input.val{width:92px;padding:8px;text-align:right}
  .sheet-actions{display:flex;gap:10px;margin-top:8px}
  .sheet-actions .btn{flex:1;justify-content:center;text-align:center;padding:13px}

  /* Toast */
  /* Above EVERY overlay, including .authscreen (80) -- it is opaque and full
     screen, so a lower toast is painted over and login errors ("Invalid login
     credentials", "Name required") silently never appear. Toasts are the only
     way this app reports failure, so they outrank anything that can cover them. */
  #toasts{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;width:calc(100% - 32px);max-width:420px}
  .toast{background:var(--text);color:var(--bg);padding:12px 16px;border-radius:12px;font-weight:600;font-size:14px;
    box-shadow:0 10px 30px rgba(0,0,0,.3);animation:pop .25s;display:flex;gap:8px;align-items:center}
  .toast.err{background:var(--neg);color:#fff}
  @keyframes pop{from{transform:translateY(12px);opacity:0}}
  .skel{height:68px;border-radius:var(--radius);background:linear-gradient(90deg,var(--border),var(--card),var(--border));
    background-size:200% 100%;animation:sh 1.2s infinite;margin-bottom:10px}
  @keyframes sh{to{background-position:-200% 0}}
  .fade{animation:fade .3s} @keyframes fade{from{opacity:0;transform:translateY(6px)}}

  /* Auth screen */
  .authscreen{position:fixed;inset:0;z-index:80;background:var(--bg);display:grid;place-items:center;padding:20px}
  .authscreen[hidden]{display:none}   /* [hidden] alone loses to display:grid */
  /* narrow screens: drop the wordmark and shrink pills so the header fits */
  @media(max-width:520px){.hbar{gap:8px;padding:12px}.wordmark{display:none}
    .pill{padding:6px 8px}.pill select,.pill b{max-width:84px}}
  .authcard{width:100%;max-width:380px;background:var(--card);border:1px solid var(--border);
    border-radius:22px;box-shadow:var(--shadow);padding:28px 24px;animation:fade .3s}
  .authcard .logo{width:46px;height:46px;border-radius:13px;margin:0 auto 14px}
  .authcard h2{text-align:center;margin:0 0 4px;font-size:22px;letter-spacing:-.02em}
  .authcard .tag{text-align:center;color:var(--muted);font-size:13px;margin-bottom:20px}
  .authcard .btn{width:100%;justify-content:center;padding:13px;margin-top:6px}
  .or{display:flex;align-items:center;gap:10px;margin:16px 0 12px;color:var(--muted);font-size:12px}
  .or::before,.or::after{content:"";flex:1;height:1px;background:var(--border)}
  .gbtn{width:100%;justify-content:center;gap:9px;padding:12px}
  .gbtn svg{width:17px;height:17px;flex:none}
  .authcard .swap{text-align:center;margin-top:16px;font-size:13.5px;color:var(--muted)}
  .authcard .swap a{cursor:pointer;font-weight:650}
  .authcard .demo{text-align:center;margin-top:14px;font-size:12px;color:var(--muted);
    background:var(--bg);border:1px dashed var(--border);border-radius:10px;padding:8px}
</style>
</head>
<body>
<!-- Logo: a geometric S built from two arcs, severed at its waist by a
     diagonal gap -- the "split" in split-expenses. Drawn as a path, not
     text, so it renders identically everywhere including as the favicon.
     Defined once here and referenced by <use> wherever the mark appears. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="swGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6d5efc"/><stop offset="1" stop-color="#9b6dff"/>
    </linearGradient>
    <symbol id="swMark" viewBox="0 0 64 64">
      <rect width="64" height="64" rx="15" fill="url(#swGrad)"/>
      <path d="M40.7 17A10 10 0 1 0 32 32A10 10 0 1 1 23.3 47"
            fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
      <!-- the cut: same gradient as the tile, so it reads as a clean gap -->
      <rect x="-8" y="29.6" width="80" height="4.8" fill="url(#swGrad)"
            transform="rotate(-25 32 32)"/>
    </symbol>

<!-- crossorigin: without it this is a no-cors request whose response is opaque
     (status 0), which the service worker cannot tell apart from a 404 and so
     refuses to cache -- leaving the offline shell to load and then crash with
     `supabase is not defined`. jsdelivr sends access-control-allow-origin: *,
     so asking for CORS costs nothing and yields a real, checkable response. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" crossorigin="anonymous"></script>
<script>
const $=(s,r=document)=>r.querySelector(s);
const SUPABASE_URL='https://zpabeysebwfqjfpwwzqw.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_UHoA1-xX9kOCx2oSIjt5ew_e-n6nosR';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
// /?invite=<token>. Stashed because signing in with Google navigates away to
// Google and back, which drops the query string -- without this, following an
// invite link and then choosing Google would silently not join the group.
let pendingInvite=new URLSearchParams(location.search).get('invite')||sessionStorage.pendingInvite||null;
if(pendingInvite)sessionStorage.pendingInvite=pendingInvite;

// Whether this project has the Google provider configured. Resolved once at
// startup by detectProviders(); the sign-in button only renders when true, so
// it can never appear and then fail.
let GOOGLE_ON=false;

// unwrap a postgrest-js/rpc call: throws like the old api() helper did, so
// every existing catch(e){toast(e.message,1)} call site keeps working.
const unwrap=async(q)=>{const {data,error}=await q;if(error)throw new Error(error.message);return data};
// calls the `api` Edge Function for the handful of actions with real logic
// (split math, settle-up, invite-by-token, balance-gated member removal).
const callFn=async(action,params={})=>{
  const {data:{session}}=await sb.auth.getSession();
  const r=await fetch(`${SUPABASE_URL}/functions/v1/api`,{method:'POST',
    headers:{'Content-Type':'application/json',apikey:SUPABASE_ANON_KEY,
             Authorization:'Bearer '+(session?.access_token||'')},
    body:JSON.stringify({action,...params})});
  let body=null; try{body=await r.json()}catch{}
  if(!r.ok)throw new Error(body?.error||r.statusText);
  return body};
// dollars -> cents via string parsing, same as the Edge Function's toCents
// (never float-multiply dollars*100).
const toCents=v=>{const m=/^(-?)(\d+)(?:\.(\d{1,2}))?$/.exec(String(v).trim());
  if(!m)throw new Error('amount must be a number');
  const [,sign,whole,frac='']=m;const c=parseInt(whole+frac.padEnd(2,'0'),10);return sign?-c:c};

const CUR={USD:'$',EUR:'€',GBP:'£',INR:'₹',CAD:'C$',AUD:'A$',SGD:'S$',AED:'AED '};
const money=v=>{const n=parseFloat(v);return (n<0?'-':'')+(S.curSym||'$')+Math.abs(n).toFixed(2)};
const AV=['#6d5efc','#12a150','#e5484d','#f5a623','#0aa2c0','#d6409f','#7d56f4','#e8590c'];
const color=s=>AV[[...s].reduce((a,c)=>a+c.charCodeAt(0),0)%AV.length];
const initials=s=>s.trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
// av() takes a user id and resolves both name and emoji, so every caller
// picks up an avatar change without threading it through by hand.
const av=id=>{const e=emojiOf(id),n=nameOf(id);
  return e?`<div class="av emoji">${e}</div>`
          :`<div class="av" style="background:${color(n)}">${initials(n)}</div>`};
function toast(msg,err){const t=document.createElement('div');t.className='toast'+(err?' err':'');
  t.innerHTML=(err?'⚠️ ':'✓ ')+msg;$('#toasts').append(t);setTimeout(()=>{t.style.opacity=0;setTimeout(()=>t.remove(),300)},2600)}

// curCode/curSym seeded to the app's default currency so money() formats
// sanely on the screens that exist before any group is loaded (Menu, and the
// personal ledger inside it).
const S={users:[],groups:[],gid:null,uid:null,members:[],expenses:[],plan:[],summary:null,tab:'expenses',
  curCode:'INR',curSym:'₹'};
// Emoji avatars: an alternative to the generated initials tile. Deliberately
// a fixed palette rather than free text -- it renders the same everywhere and
// there's nothing to validate. "Aa" clears it back to initials.
const EMOJI=['😀','😎','🤓','🥳','😇','🤠','👻','🐶','🐱','🦊','🐼','🦁','🐯','🐨','🐵','🐧',
  '🦉','🦄','🐢','🐝','🌟','🔥','🌈','🌴','🍕','🍔','🍩','🍺','☕','🎸','⚽','🏀','🎮','🚀','💎','🎁'];

const emojiPicker=(id,current)=>`
  <div class="field"><label>Avatar</label>
    <div class="emoji-grid" id="${id}_grid">
      <button type="button" class="ebtn none${current?'':' on'}" data-e="" title="Use initials">Aa</button>
      ${EMOJI.map(e=>`<button type="button" class="ebtn${current===e?' on':''}" data-e="${e}">${e}</button>`).join('')}
    </div>
  </div>`;

// returns a getter for the current selection
function wireEmojiPicker(id,current){
  let val=current||'';
  const grid=$(`#${id}_grid`);
  grid.onclick=e=>{const b=e.target.closest('.ebtn');if(!b)return;
    val=b.dataset.e;
    grid.querySelectorAll('.ebtn').forEach(x=>x.classList.toggle('on',x===b))};
  return ()=>val;
}

const findUser=id=>S.members.find(x=>x.user_id===id)||S.users.find(x=>x.id===id);
const nameOf=id=>{const m=findUser(id);return m?(m.name):('#'+id)};
const emojiOf=id=>{const m=findUser(id);return m&&m.avatar_emoji||''};

// ---- theme ----
const themeBtn=$('#themeBtn');
function applyTheme(t){if(t)document.documentElement.dataset.theme=t;
  const dark=(document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'))==='dark';
  themeBtn.textContent=dark?'☀️':'🌙'}
themeBtn.onclick=()=>{const cur=document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
  const next=cur==='dark'?'light':'dark';localStorage.theme=next;applyTheme(next)};
applyTheme(localStorage.theme);

// ---- auth ----
function hideAuth(){$('#authScreen').hidden=true}
let authMode='login';   // remembered so a late redraw keeps login vs signup
function showAuth(mode='login'){
  authMode=mode;
  const a=$('#authScreen');a.hidden=false;const login=mode==='login';
  a.innerHTML=`<div class="authcard">
    <div class="logo"><svg viewBox="0 0 64 64" role="img" aria-label="shareware"><use href="#swMark"/></svg></div>
    <h2>shareware</h2><div class="tag">${login?'Sign in to split expenses':'Create your account'}</div>
    ${login?'':'<div class="field"><label>Name</label><input id="au_name" placeholder="Alex"></div>'}
    <div class="field"><label>Email</label><input id="au_email" type="email" placeholder="you@example.com" autocomplete="username"></div>
    <div class="field"><label>Password</label><input id="au_pw" type="password" placeholder="••••••" autocomplete="${login?'current':'new'}-password"></div>
    <button class="btn" id="au_go">${login?'Sign in':'Create account'}</button>
    ${GOOGLE_ON?`<div class="or"><span>or</span></div>
      <button class="btn ghost gbtn" id="au_google"><svg viewBox="0 0 18 18"><use href="#swGoogle"/></svg>Continue with Google</button>`:''}
    <div class="swap">${login?'New here? <a id="au_swap">Create an account</a>':'Have an account? <a id="au_swap">Sign in</a>'}</div>
  </div>`;
  $('#au_swap').onclick=()=>showAuth(login?'signup':'login');
  const submit=async()=>{
    const email=$('#au_email').value.trim(),pw=$('#au_pw').value;
    if(!email||!pw)return toast('Email and password required',1);
    const name=$('#au_name')?.value.trim();
    if(!login&&!name)return toast('Name required',1);
    try{
      const {error}=login
        ? await sb.auth.signInWithPassword({email,password:pw})
        : await sb.auth.signUp({email,password:pw,options:{data:{name}}});
      if(error)throw new Error(error.message);
      toast(login?'Welcome back':'Account created');await boot();
    }catch(e){toast(e.message,1)}
  };
  $('#au_go').onclick=submit;
  if($('#au_google'))$('#au_google').onclick=async()=>{
    // Comes back to this same page; the session is then picked up by the
    // onAuthStateChange handler below, since the code exchange is async.
    const {error}=await sb.auth.signInWithOAuth({provider:'google',
      options:{redirectTo:location.origin+location.pathname}});
    if(error)toast(error.message,1);
  };
  a.querySelectorAll('input').forEach(i=>i.onkeydown=e=>{if(e.key==='Enter')submit()});
}
async function logout(){await sb.auth.signOut();S.uid=null;showAuth()}
$('#mePill').style.cursor='pointer';
$('#mePill').onclick=openSettings;
function openSettings(){
  const p=(S.me&&S.me.pay)||{};
  openSheet(`<h3>Your account</h3>
    <div class="field"><label>Name</label><input id="se_name" value="${(S.me?.name||'').replace(/"/g,'&quot;')}"></div>
    ${emojiPicker('se',S.me?.avatar_emoji)}
    <p style="color:var(--muted);font-size:12.5px;margin:8px 0 14px">Payment handles — group members can pay you back in one tap on the Settle-up tab.</p>
    <div class="field"><label>UPI ID</label><input id="se_upi" placeholder="you@bank" value="${p.upi||''}"></div>
    <div class="field"><label>PayPal.me username</label><input id="se_paypal" placeholder="yourname" value="${p.paypal||''}"></div>
    <div class="field"><label>Venmo username</label><input id="se_venmo" placeholder="yourname" value="${p.venmo||''}"></div>
    <div class="sheet-actions"><button class="btn ghost" onclick="closeSheet()" style="flex:.5">Cancel</button>
      <button class="btn" id="se_save">Save</button></div>`);
  const getEmoji=wireEmojiPicker('se',S.me?.avatar_emoji);
  $('#se_save').onclick=async()=>{
    try{
      const name=$('#se_name').value.trim();
      if(!name)throw new Error('name cannot be empty');
      const row=await unwrap(sb.from('profiles').update({
        name, upi_id:$('#se_upi').value.trim()||null,
        paypal_me:$('#se_paypal').value.trim()||null,
        venmo:$('#se_venmo').value.trim()||null,
        avatar_emoji:getEmoji()||null,
      }).eq('id',S.uid).select('name,upi_id,paypal_me,venmo,avatar_emoji').single());
      S.me={id:S.uid,name:row.name,email:S.me.email,avatar_emoji:row.avatar_emoji,
            pay:{upi:row.upi_id,paypal:row.paypal_me,venmo:row.venmo}};
      $('#meName').textContent=row.name;closeSheet();toast('Saved');
      await refreshUsers();await loadGroup();
    }catch(e){toast(e.message,1)}};
}

// ---- boot ----
async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){showAuth();return}
  const {data:{user}}=await sb.auth.getUser();
  if(!user){showAuth();return}
  let meRow;
  try{meRow=await unwrap(sb.from('profiles').select('name,upi_id,paypal_me,venmo,avatar_emoji').eq('id',user.id).single())}
  catch{showAuth();return}
  hideAuth();
  S.me={id:user.id,name:meRow.name,email:user.email,avatar_emoji:meRow.avatar_emoji,
        pay:{upi:meRow.upi_id,paypal:meRow.paypal_me,venmo:meRow.venmo}};
  S.uid=user.id;$('#meName').textContent=meRow.name;
  let jumpTo=null;
  if(pendingInvite){                                   // arrived via an invite link
    try{const j=await callFn('accept_invite',{token:pendingInvite});toast(`Joined ${j.name}`);jumpTo=j.id}
    catch(e){toast(e.message,1)}
    pendingInvite=null;sessionStorage.removeItem('pendingInvite');
    history.replaceState({},'',location.pathname);
  }
  S.users=await unwrap(sb.from('profiles').select('id,name,avatar_emoji').order('name'));
  // created_by rides along so the Menu tab knows whether to offer "delete
  // group" -- the delete policy is creator-only, and a delete the server
  // silently drops would otherwise report success.
  S.groups=await unwrap(sb.from('groups').select('id,name,created_by').order('id'));
  $('#groupSel').innerHTML=S.groups.map(g=>`<option value="${g.id}">${g.name}</option>`).join('')+'<option value="__new">＋ New group</option>';
  if(!S.groups.length){$('#hero').innerHTML='';$('#budgets').innerHTML='';S.gid=null;render();return}
  S.gid=(jumpTo&&S.groups.some(g=>g.id===jumpTo))?jumpTo:S.groups[0].id;
  $('#groupSel').value=S.gid;
  await loadGroup();
}
$('#groupSel').onchange=async e=>{if(e.target.value==='__new'){e.target.value=S.gid||'';openNewGroup();return}
  S.gid=+e.target.value;S.screen=null;await loadGroup()};   // picking a group means you want to see it

async function loadGroup(){
  $('#view').innerHTML='<div class="skel"></div><div class="skel"></div><div class="skel"></div>';
  const [g,exRows,plan]=await Promise.all([
    callFn('group_detail',{group_id:S.gid}),
    unwrap(sb.from('expenses').select('id,paid_by,amount_cents,description,expense_shares(user_id,share_cents)')
      .eq('group_id',S.gid).is('deleted_at',null).order('id',{ascending:false}).limit(50)),
    callFn('settle_up',{group_id:S.gid}),
  ]);
  S.members=g.members;
  S.expenses=exRows.map(e=>({id:e.id,paid_by:e.paid_by,description:e.description,
    amount:(e.amount_cents/100).toFixed(2),
    shares:e.expense_shares.map(s=>({user_id:s.user_id,share:(s.share_cents/100).toFixed(2)}))}));
  S.plan=plan;S.groupObj=g;
  S.curCode=g.currency||'INR';S.curSym=CUR[S.curCode]||(S.curCode+' ');
  try{S.summary=await callFn('user_summary')}catch{S.summary=null}
  renderHero();render();
}

// ---- hero ----
function renderHero(){
  const me=S.members.find(m=>m.user_id===S.uid);
  const bal=me?parseFloat(me.balance):0;
  const state=bal>0.001?'you are owed':bal<-0.001?'you owe':'all settled up';
  const s=(S.summary&&S.summary.by_currency&&S.summary.by_currency[S.curCode])||{owed:'0.00',owe:'0.00',net:'0.00'};
  $('#hero').innerHTML=`
    <div class="who">${av(S.uid)}<span>${nameOf(S.uid)} · in ${S.groupObj?.name||''}</span></div>
    <div class="amt">${money(Math.abs(bal))}</div>
    <div class="sub">${state}</div>
    <div class="stats">
      <div><span>owed to you · all ${S.curCode} groups</span><b style="color:#eafff2">${money(s.owed)}</b></div>
      <div><span>you owe · all ${S.curCode} groups</span><b style="color:#ffe9ea">${money(s.owe)}</b></div>
      <div><span>net</span><b>${money(s.net)}</b></div>
    </div>`;
  $('#hero').classList.add('fade');
  $('#budgets').innerHTML=renderBudgets();
}

// ---- budgets ----
// Spend, not balance: the meter tracks what was consumed, so settling up with
// someone doesn't refill it.
function budgetBar(label,spend,budget){
  const s=parseFloat(spend||'0'), b=parseFloat(budget||'0');
  const pct=b>0?(s/b)*100:0;
  const cls=pct>100?'over':pct>=80?'warn':'ok';
  const left=b-s;
  return `<div class="budget" onclick="openBudgets()">
    <div class="bhead"><span class="blabel">${label}</span>
      <span class="bpct ${cls}">${Math.round(pct)}%</span></div>
    <div class="track"><div class="fill ${cls}" style="width:${Math.min(pct,100)}%"></div></div>
    <div class="bnum" style="margin-top:7px">${money(s)} of ${money(b)} ·
      ${left>=0?`${money(left)} left`:`${money(-left)} over`}</div>
  </div>`;
}

function renderBudgets(){
  if(!S.gid||!S.groupObj)return '';
  const me=S.members.find(m=>m.user_id===S.uid);
  let out='';
  if(S.groupObj.budget)out+=budgetBar('Group budget',S.groupObj.spend,S.groupObj.budget);
  if(me&&me.budget)out+=budgetBar('My budget',me.spend,me.budget);
  if(!out)out=`<div class="budget unset" onclick="openBudgets()">＋ Set a budget</div>`;
  return out;
}

function openBudgets(){
  const me=S.members.find(m=>m.user_id===S.uid);
  openSheet(`<h3>Budgets</h3>
    <p style="color:var(--muted);font-size:13px;margin:-6px 0 16px">Tracks what's been <b>spent</b> — your share of each expense — not who owes whom. Leave blank for no budget.</p>
    <div class="field"><label>Group budget (${S.curSym}) — shared with everyone</label>
      <input id="b_group" type="number" step="0.01" inputmode="decimal" placeholder="none" value="${S.groupObj.budget||''}"></div>
    <div class="field"><label>My budget (${S.curSym}) — tracks just your own share</label>
      <input id="b_mine" type="number" step="0.01" inputmode="decimal" placeholder="none" value="${me?.budget||''}"></div>
    <div class="sheet-actions"><button class="btn ghost" onclick="closeSheet()" style="flex:.5">Cancel</button>
      <button class="btn" id="b_save">Save</button></div>`);
  $('#b_save').onclick=async()=>{
    const parse=v=>{v=v.trim();if(!v)return null;
      const c=toCents(v);if(c<=0)throw new Error('budget must be positive');return c};
    try{
      const g=parse($('#b_group').value), mine=parse($('#b_mine').value);
      await unwrap(sb.from('groups').update({budget_cents:g}).eq('id',S.gid));
      await unwrap(sb.from('memberships').update({budget_cents:mine})
        .eq('group_id',S.gid).eq('user_id',S.uid));
      closeSheet();toast('Budget saved');await loadGroup();
    }catch(e){toast(e.message,1)}};
}

// ---- tabs ----
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  S.tab=b.dataset.tab;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x===b));render()});

const emptyState=`<div class="empty"><div class="big">🫙</div>No groups yet.<br>
  <button class="btn" style="margin-top:14px" onclick="openNewGroup()">Create your first group</button></div>`;

function render(){
  const v=$('#view');v.className='fade';
  // Monthly money is a destination, not a tab: it has nothing to do with the
  // selected group, so the hero, budget meters and tab row all step aside for
  // it (CSS below) and the FAB repoints at the thing you'd actually add here.
  const monthly=S.screen==='monthly';
  document.body.classList.toggle('screen-monthly',monthly);
  $('#fab').textContent=monthly?'＋ Add entry':'＋ Add expense';
  $('#fab').onclick=monthly?openAddPersonal:openAddExpense;
  if(monthly)return renderMonthly(v);
  // Guard every tab on having a group. The tab buttons stay live even when
  // boot() found no groups, and Balances would otherwise offer Invite /
  // Add member -- both of which fail on a null group_id (bigint parse error,
  // then an RLS violation) with no useful message to the user.
  if(!S.gid){v.innerHTML=emptyState;return}
  if(S.tab==='expenses')return renderExpenses(v);
  if(S.tab==='balances')return renderBalances(v);
  return renderSettle(v);
}

function renderExpenses(v){
  if(!S.expenses.length){v.innerHTML=`<div class="empty"><div class="big">🧾</div>No expenses yet.<br>Tap “Add expense”.</div>`;return}
  v.innerHTML=`<div class="card">`+S.expenses.map(e=>{
    const parts=e.shares.map(s=>nameOf(s.user_id)).join(', ');
    return `<div class="row">
      ${av(e.paid_by)}
      <div class="grow"><div class="t">${e.description||'Expense'}</div>
        <div class="m">${nameOf(e.paid_by)} paid · split ${e.shares.length} ways</div></div>
      <div class="amt-lg">${money(e.amount)}</div>
      <button class="del" title="Delete" onclick="delExpense(${e.id})">🗑</button>
    </div>`}).join('')+`</div>`;
}

// couples/households are a client-side view grouping, stored per group in localStorage.
// balances stay per-person on the server; we just display & total linked partners together.
const hhKey=()=>`households:${S.gid}`;
const getHH=()=>{try{return JSON.parse(localStorage[hhKey()]||'[]')}catch{return[]}};
const setHH=h=>localStorage[hhKey()]=JSON.stringify(h);
function balMeta(b){b=parseFloat(b);const cls=b>0.001?'pos':b<-0.001?'neg':'zero';
  const lbl=b>0.001?`gets back ${money(b)}`:b<-0.001?`owes ${money(-b)}`:'settled';return{cls,lbl}}
// Rename is offered only for members with no account (is_shadow) -- a real
// user's name is their own profile. Remove is offered for everyone; the
// Edge Function rejects it if their balance isn't zero.
const memberActions=m=>
  `${m.is_shadow?`<button class="mini edit" title="Rename" onclick="openEditMember('${m.user_id}')"><svg viewBox="0 0 16 16"><use href="#swEdit"/></svg></button>`:''}
   <button class="mini" title="${m.user_id===S.uid?'Leave group':'Remove from group'}" onclick="removeMember('${m.user_id}')"><svg viewBox="0 0 16 16"><use href="#swX"/></svg></button>`;

const memberRow=m=>{const {cls,lbl}=balMeta(m.balance);return `<div class="row">${av(m.user_id)}
    <div class="grow"><div class="t">${m.name}${m.user_id===S.uid?' <span class="m">(you)</span>':''}${m.is_shadow?' <span class="m">· no account</span>':''}</div>
      <div class="m">${lbl}</div></div><div class="chip ${cls}">${money(m.balance)}</div>${memberActions(m)}</div>`};

function renderBalances(v){
  const byId=Object.fromEntries(S.members.map(m=>[m.user_id,m]));
  let hh=getHH().filter(p=>byId[p[0]]&&byId[p[1]]); setHH(hh);   // drop stale links
  const inHH=new Set(hh.flat());
  let rows='';
  hh.forEach((pair,i)=>{
    const [a,b]=pair.map(id=>byId[id]);
    const combined=(parseFloat(a.balance)+parseFloat(b.balance)).toFixed(2);
    const {cls,lbl}=balMeta(combined);
    rows+=`<div class="row" style="background:var(--bg)">
      <div style="display:flex;flex:none">${av(a.user_id)}<div style="margin-left:-14px">${av(b.user_id)}</div></div>
      <div class="grow"><div class="t">${a.name} & ${b.name} <span class="m">· couple</span></div>
        <div class="m">${lbl} together</div></div>
      <div class="chip ${cls}">${money(combined)}</div>
      <button class="mini" title="Unlink" onclick="unlinkCouple(${i})"><svg viewBox="0 0 16 16"><use href="#swX"/></svg></button></div>`;
    [a,b].forEach(m=>{const mm=balMeta(m.balance);
      rows+=`<div class="row" style="padding-left:34px;opacity:.82">${av(m.user_id)}
        <div class="grow"><div class="t">${m.name}${m.user_id===S.uid?' <span class="m">(you)</span>':''}${m.is_shadow?' <span class="m">· no account</span>':''}</div>
          <div class="m">${mm.lbl}</div></div><div class="chip ${mm.cls}">${money(m.balance)}</div>${memberActions(m)}</div>`});
  });
  S.members.filter(m=>!inHH.has(m.user_id)).forEach(m=>rows+=memberRow(m));
  v.innerHTML=`<div class="sec-head"><h2>Members · ${S.members.length}</h2>
      <div style="display:flex;gap:14px">
        <button class="link-btn" onclick="openInvite()">🔗 Invite</button>
        ${S.members.length>=2?'<button class="link-btn" onclick="openLinkCouple()">＋ Link couple</button>':''}
        <button class="link-btn" onclick="openAddMember()">＋ Add member</button></div></div>
    <div class="card">${rows||'<div class="empty">No members</div>'}</div>`;
}
function unlinkCouple(i){const h=getHH();h.splice(i,1);setHH(h);toast('Couple unlinked');render()}

async function removeMember(uid){
  const m=S.members.find(x=>x.user_id===uid); if(!m)return;
  const self=uid===S.uid;
  if(!confirm(self?`Leave ${S.groupObj.name}?`
                  :`Remove ${m.name} from ${S.groupObj.name}?`))return;
  try{
    await callFn('remove_member',{group_id:S.gid,user_id:uid});
    // drop any couple link that referenced them, so the view doesn't keep a stale pair
    setHH(getHH().filter(p=>!p.includes(uid)));
    toast(self?'You left the group':`${m.name} removed`);
    await refreshUsers();
    if(self)await boot();          // no longer a member: re-read which groups we can see
    else await loadGroup();
  }catch(e){toast(e.message,1)}    // e.g. "member has a nonzero balance"
}

function openEditMember(uid){
  const m=S.members.find(x=>x.user_id===uid); if(!m)return;
  openSheet(`<h3>Edit member</h3>
    <p style="color:var(--muted);font-size:13px;margin:-6px 0 16px">${m.name} has no account, so this is just a label for the group — handy for fixing a typo or telling two people with the same name apart.</p>
    <div class="field"><label>Name</label><input id="rn_name" value="${m.name.replace(/"/g,'&quot;')}"></div>
    ${emojiPicker('rn',m.avatar_emoji)}
    <div class="sheet-actions"><button class="btn ghost" onclick="closeSheet()" style="flex:.5">Cancel</button>
      <button class="btn" id="rn_save">Save</button></div>`);
  const getEmoji=wireEmojiPicker('rn',m.avatar_emoji);
  $('#rn_save').onclick=async()=>{
    const n=$('#rn_name').value.trim(); if(!n)return toast('Enter a name',1);
    try{await callFn('update_member',{group_id:S.gid,user_id:uid,name:n,avatar_emoji:getEmoji()});
      closeSheet();toast('Saved');await refreshUsers();await loadGroup()}
    catch(e){toast(e.message,1)}};
}

async function openInvite(){
  let token;
  try{
    const existing=await unwrap(sb.from('invites').select('token').eq('group_id',S.gid).maybeSingle());
    token=existing?.token;
    if(!token){
      const created=await unwrap(sb.from('invites').insert({group_id:S.gid,created_by:S.uid}).select('token').single());
      token=created.token;
    }
  }catch(e){return toast(e.message,1)}
  const url=`${location.origin}${location.pathname}?invite=${token}`;
  openSheet(`<h3>Invite to ${S.groupObj.name}</h3>
    <p style="color:var(--muted);font-size:13px;margin:-6px 0 16px">Anyone with this link can sign in and join this group.</p>
    <div class="field"><label>Invite link</label><input id="inv_url" readonly value="${url}"></div>
    <div class="sheet-actions"><button class="btn ghost" onclick="closeSheet()" style="flex:.5">Close</button>
      <button class="btn" id="inv_copy">Copy link</button></div>`);
  $('#inv_copy').onclick=async()=>{
    try{await navigator.clipboard.writeText(url)}
    catch{const el=$('#inv_url');el.select();document.execCommand('copy')}
    toast('Link copied')};
}
function openLinkCouple(){
  const inHH=new Set(getHH().flat());
  const free=S.members.filter(m=>!inHH.has(m.user_id));
  if(free.length<2)return toast('Need two unlinked members',1);
  const opts=free.map(m=>`<option value="${m.user_id}">${m.name}</option>`).join('');
  openSheet(`<h3>Link a couple</h3>
    <p style="color:var(--muted);font-size:13px;margin:-6px 0 16px">Shown together with a combined balance. Each partner still keeps their own share of every expense.</p>
    <div class="field"><label>Partner 1</label><select id="c_a">${opts}</select></div>
    <div class="field"><label>Partner 2</label><select id="c_b">${opts}</select></div>
    <div class="sheet-actions"><button class="btn ghost" onclick="closeSheet()" style="flex:.5">Cancel</button>
      <button class="btn" id="c_save">Link couple</button></div>`);
  $('#c_b').selectedIndex=Math.min(1,free.length-1);
  $('#c_save').onclick=()=>{const a=$('#c_a').value,b=$('#c_b').value;
    if(a===b)return toast('Pick two different people',1);
    const h=getHH();h.push([a,b]);setHH(h);closeSheet();toast('Couple linked');render()};
}

function payLinks(uid,amount){
  const m=S.members.find(x=>x.user_id===uid),p=m&&m.pay; if(!p)return [];
  const note=encodeURIComponent('shareware'+(S.groupObj?' '+S.groupObj.name:'')),nm=encodeURIComponent(m.name);
  const out=[];
  if(p.upi)out.push({label:'UPI',url:`upi://pay?pa=${encodeURIComponent(p.upi)}&pn=${nm}&am=${amount}&cu=INR&tn=${note}`});
  if(p.paypal)out.push({label:'PayPal',url:`https://paypal.me/${encodeURIComponent(p.paypal)}/${amount}`});
  if(p.venmo)out.push({label:'Venmo',url:`https://venmo.com/${encodeURIComponent(p.venmo)}?txn=pay&amount=${amount}&note=${note}`});
  return out;
}

function renderSettle(v){
  if(!S.plan.length){v.innerHTML=`<div class="empty"><div class="big">🎉</div>Everyone’s settled up!</div>`;return}
  v.innerHTML=`<div class="sec-head"><h2>Suggested payments · ${S.plan.length}</h2>
      <span class="m" style="color:var(--muted);font-size:12px">${S.groupObj?.simplify_debts?'simplified':'direct'}</span></div>
    <div class="card">`+S.plan.map(p=>{
    const mine=p.from_user===S.uid||p.to_user===S.uid;
    const pays=p.from_user===S.uid?payLinks(p.to_user,p.amount):[];
    const payBtns=pays.map(l=>`<a class="btn ghost sm" href="${l.url}" target="_blank" rel="noopener">${l.label}</a>`).join('');
    const role=p.from_user===S.uid?'you pay':p.to_user===S.uid?'pays you':'suggested';
    return `<div class="row settle-row" ${mine?'style="background:var(--pos-bg)"':''}>
      ${av(p.from_user)}
      <div class="grow"><div class="t">${nameOf(p.from_user)} <span class="arrow">→</span> ${nameOf(p.to_user)}</div>
        <div class="m">${role} · <b>${money(p.amount)}</b></div></div>
      <div style="display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;align-items:center">
        ${payBtns}<button class="btn sm" onclick="settle('${p.from_user}','${p.to_user}','${p.amount}')">Settle</button>
      </div>
    </div>`}).join('')+`</div>`;
}

async function deleteGroup(){
  const g=S.groups.find(x=>x.id===S.gid); if(!g)return;
  if(!confirm(`Delete "${g.name}" for everyone?\n\nEvery expense, payment and balance in it is removed permanently. This cannot be undone.`))return;
  const key=hhKey();                        // depends on S.gid, so read it before boot() clears it
  try{
    // .select() so a delete RLS refused (not the creator) comes back as zero
    // rows instead of a silent 204 that looks exactly like success.
    const gone=await unwrap(sb.from('groups').delete().eq('id',S.gid).select('id'));
    if(!gone.length)throw new Error('only the group’s creator can delete it');
    localStorage.removeItem(key);
    closeSheet();toast(`${g.name} deleted`);await boot();
  }catch(e){toast(e.message,1)}
}

// ---- personal monthly ledger ----
// Yours alone and outside the group ledger entirely -- none of this moves
// anybody's balance. ponytail: rendered in the selected group's currency,
// since the app has no cross-currency conversion anywhere and almost everyone
// here is in one currency.
//
// Dates are handled as 'YYYY-MM-DD' strings end to end and never parsed into a
// Date for display. `new Date('2026-08-01')` is UTC midnight, which renders as
// July 31st for anyone west of Greenwich -- the classic off-by-one that makes a
// calendar quietly wrong. The only Date used here is for grid arithmetic, in
// UTC, where no local offset can reach it.
const pad2=n=>String(n).padStart(2,'0');
const todayStr=()=>{const d=new Date();                      // local parts, not toISOString
  return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`};
const thisMonth=()=>todayStr().slice(0,7);
const MONTHS=['January','February','March','April','May','June','July',
  'August','September','October','November','December'];

// Everything the calendar needs about a 'YYYY-MM', derived, nothing stored.
function monthMeta(ym){
  const [y,mo]=ym.split('-').map(Number);
  return {y,mo,
    days:new Date(Date.UTC(y,mo,0)).getUTCDate(),            // day 0 of next month
    firstDow:(new Date(Date.UTC(y,mo-1,1)).getUTCDay()+6)%7, // Mon = 0
    prev:mo===1?`${y-1}-12`:`${y}-${pad2(mo-1)}`,
    next:mo===12?`${y+1}-01`:`${y}-${pad2(mo+1)}`,
    label:`${MONTHS[mo-1]} ${y}`};
}

// One round trip covers the shown month AND the one before it, because every
// metric on this screen is a comparison against last month. Fetching them
// separately would double the latency to say the same thing.
async function openMonthly(ym){
  S.screen='monthly';S.pmMonth=ym||thisMonth();S.pmDay=null;
  await loadMonthly();
}
function exitMonthly(){S.screen=null;render()}
async function loadMonthly(){
  const m=monthMeta(S.pmMonth);
  try{S.pmRows=await unwrap(sb.from('personal_entries')
    .select('id,entry_date,kind,label,amount_cents')
    .gte('entry_date',`${m.prev}-01`).lt('entry_date',`${m.next}-01`)
    .order('entry_date',{ascending:false}).order('id',{ascending:false}))}
  catch(e){S.pmRows=[];toast(e.message,1)}
  render();
}

// Single pass over both months: per-day buckets, this month's totals, and last
// month's spend all fall out of one loop rather than four filter+reduce scans.
function monthlyStats(){
  const m=monthMeta(S.pmMonth),curPre=S.pmMonth+'-',prevPre=m.prev+'-';
  const live=S.pmMonth===thisMonth();
  const elapsed=live?Number(todayStr().slice(8)):m.days;
  const day=new Array(m.days+1);
  let spent=0,saved=0,prevSpent=0,maxDay=0;
  for(const r of S.pmRows){
    if(r.entry_date.startsWith(curPre)){
      const d=+r.entry_date.slice(8);
      const c=day[d]||(day[d]={spent:0,saved:0});
      if(r.kind==='expense'){spent+=r.amount_cents;c.spent+=r.amount_cents;
        if(c.spent>maxDay)maxDay=c.spent}
      else{saved+=r.amount_cents;c.saved+=r.amount_cents}
    }else if(r.entry_date.startsWith(prevPre)&&r.kind==='expense'){
      prevSpent+=r.amount_cents;
    }
  }
  let noSpend=0;
  for(let d=1;d<=elapsed;d++)if(!day[d]||!day[d].spent)noSpend++;
  const perDay=elapsed?spent/elapsed:0;
  return {m,live,elapsed,day,spent,saved,prevSpent,maxDay,noSpend,perDay,
    // A run-rate off two or three days is noise, not a forecast, so we don't
    // pretend to have one. Past months project to what actually happened.
    projected:live?(elapsed>=5?Math.round(perDay*m.days):null):spent};
}

function renderMonthly(v){
  const s=monthlyStats(),m=s.m;
  const met=(k,val,c)=>`<div class="met"><div class="k">${k}</div>
    <div class="v"${c?` style="color:${c}"`:''}>${val}</div></div>`;
  v.innerHTML=`
    <div class="vhead"><button class="back" onclick="exitMonthly()" aria-label="Back">‹</button>
      <h1>Monthly money</h1></div>
    <p style="color:var(--muted);font-size:13px;margin:0 4px 12px">Just yours — nobody else can see it, and nothing here changes what anyone owes.</p>
    <div class="pmbar">
      <button class="back" onclick="goMonth('${m.prev}')" aria-label="Previous month">‹</button>
      <input id="pm_month" type="month" value="${S.pmMonth}" aria-label="Month">
      <button class="back" onclick="goMonth('${m.next}')" aria-label="Next month">›</button>
    </div>
    <div class="mets">
      ${met('spent',money(s.spent/100),'var(--neg)')}
      ${met('saved',money(s.saved/100),'var(--pos)')}
      ${met('net',money((s.saved-s.spent)/100))}
      ${met('per day',money(s.perDay/100))}
      ${met('no-spend days',`${s.noSpend} <span style="font-size:12px;color:var(--muted);font-weight:600">of ${s.elapsed}</span>`)}
    </div>
    ${nudge(s)}
    ${calendar(s)}
    ${entryList(s)}`;
  $('#pm_month').onchange=e=>goMonth(e.target.value);
}
function goMonth(ym){S.pmMonth=ym;S.pmDay=null;loadMonthly()}

// The deterrent is arithmetic, not scolding: show where this pace lands and
// what that costs against last month. A number someone can act on beats a
// telling-off they'll dismiss.
function nudge(s){
  const prevLabel=MONTHS[monthMeta(s.m.prev).mo-1];
  if(s.live&&s.projected===null)
    return `<div class="nudge"><span>📊</span><span>${money(s.spent/100)} so far. A few more days and there's enough here to project the month.</span></div>`;
  const end=s.projected;
  if(!end&&!s.prevSpent)return '';
  if(!s.prevSpent)
    return `<div class="nudge"><span>📊</span><span>${s.live?`On this pace you'll finish ${MONTHS[s.m.mo-1]} at <b>${money(end/100)}</b>.`:`<b>${money(end/100)}</b> spent in ${MONTHS[s.m.mo-1]}.`} No ${prevLabel} figures to compare against yet.</span></div>`;
  const diff=end-s.prevSpent,up=diff>0;
  return `<div class="nudge ${up?'up':'down'}"><span>${up?'⚠️':'✅'}</span><span>
    ${s.live?`On this pace you'll finish ${MONTHS[s.m.mo-1]} at <b>${money(end/100)}</b>`
            :`<b>${money(end/100)}</b> spent in ${MONTHS[s.m.mo-1]}`} —
    <b>${money(Math.abs(diff)/100)} ${up?'more':'less'}</b> than ${prevLabel}'s ${money(s.prevSpent/100)}.
    ${up?`That's ${Math.round((diff/s.prevSpent)*100)}% up.`:''}</span></div>`;
}

// Heat is spend per day against the month's own worst day, so the scale always
// fits whoever is looking at it. Colour alone can't carry meaning, so every
// cell's amount is in its aria-label and the day's total sits under the list.
function calendar(s){
  const cells=[];
  for(let i=0;i<s.m.firstDow;i++)cells.push('<div class="cday blank"></div>');
  for(let d=1;d<=s.m.days;d++){
    const c=s.day[d],iso=`${S.pmMonth}-${pad2(d)}`;
    const t=c&&c.spent&&s.maxDay?c.spent/s.maxDay:0;
    const bg=t?`background:color-mix(in srgb,var(--neg) ${Math.round(16+t*54)}%,transparent)`:'';
    const cls=['cday',S.pmDay===d?'sel':'',iso===todayStr()?'today':''].filter(Boolean).join(' ');
    cells.push(`<button class="${cls}" style="${bg}" onclick="pickDay(${d})"
      aria-label="${d} ${MONTHS[s.m.mo-1]}: ${c&&c.spent?money(c.spent/100)+' spent':'nothing spent'}${c&&c.saved?', '+money(c.saved/100)+' saved':''}">
      <span>${d}</span>${c&&c.saved?'<span class="dot"></span>':''}</button>`);
  }
  return `<div class="sec-head"><h2>By day</h2>
      <span style="color:var(--muted);font-size:12px">tap a day to filter</span></div>
    <div class="card" style="padding:12px">
      <div class="cal">${['M','T','W','T','F','S','S'].map(d=>`<div class="dow">${d}</div>`).join('')}${cells.join('')}</div>
      <div class="callegend"><span class="dot"></span> saved something
        <span style="margin-left:auto">less</span><i class="ramp"></i><span>more spent</span></div>
    </div>`;
}
function pickDay(d){S.pmDay=S.pmDay===d?null:d;render()}

function entryList(s){
  const pre=S.pmMonth+'-';
  let rows=S.pmRows.filter(r=>r.entry_date.startsWith(pre));
  if(S.pmDay)rows=rows.filter(r=>+r.entry_date.slice(8)===S.pmDay);
  // when filtered, the heading carries the day's money -- that's what the
  // separator would have said, and a row count says nothing the list doesn't
  const c=S.pmDay&&s.day[S.pmDay];
  const dayTot=c?[c.spent?money(c.spent/100)+' spent':'',c.saved?money(c.saved/100)+' saved':'']
    .filter(Boolean).join(' · '):'';
  const head=`<div class="sec-head"><h2>${S.pmDay?`${S.pmDay} ${MONTHS[s.m.mo-1]}${dayTot?' · '+dayTot:''}`:`Entries · ${rows.length}`}</h2>
    ${S.pmDay?'<button class="link-btn" onclick="pickDay(null)">Show whole month</button>':''}</div>`;
  if(!rows.length)return head+`<div class="empty">${S.pmDay?'Nothing logged that day.':'Nothing logged this month yet.'}</div>`;
  // rows arrive newest-first, so a date subhead every time the date changes
  // groups them without a second pass or a lookup table.
  let last=null,out='';
  for(const r of rows){
    // filtered to one day, the heading above already says which -- a separator
    // per date would just repeat it
    if(r.entry_date!==last&&!S.pmDay){
      last=r.entry_date;
      const d=+r.entry_date.slice(8),c=s.day[d];
      out+=`<div class="daysep"><span>${d} ${MONTHS[s.m.mo-1]}</span>
        <span>${c.spent?money(c.spent/100)+' spent':''}${c.spent&&c.saved?' · ':''}${c.saved?money(c.saved/100)+' saved':''}</span></div>`;
    }
    out+=`<div class="row"><div class="av emoji">${r.kind==='saving'?'🏦':'🧾'}</div>
      <div class="grow"><div class="t">${r.label}</div><div class="m">${r.kind==='saving'?'saved':'spent'}</div></div>
      <div class="amt-lg" style="color:var(--${r.kind==='saving'?'pos':'neg'})">${money(r.amount_cents/100)}</div>
      <button class="del" title="Delete" onclick="delPersonal(${r.id})">🗑</button></div>`;
  }
  return head+`<div class="card">${out}</div>`;
}

function openAddPersonal(){
  const m=monthMeta(S.pmMonth);
  // default to the day you're looking at, else today, else the 1st -- never a
  // date outside the month on screen, which would vanish on save
  const def=S.pmDay?`${S.pmMonth}-${pad2(S.pmDay)}`
           :S.pmMonth===thisMonth()?todayStr():`${S.pmMonth}-01`;
  openSheet(`<h3>Add entry</h3>
    <div class="field"><label>Date</label><input id="pa_date" type="date" value="${def}"
      min="${S.pmMonth}-01" max="${S.pmMonth}-${pad2(m.days)}"></div>
    <div class="field"><label>What was it?</label><input id="pa_label" placeholder="Rent, groceries, SIP…"></div>
    <div class="field"><label>Amount (${S.curSym.trim()})</label><input id="pa_amt" type="number" step="0.01" inputmode="decimal" placeholder="0.00"></div>
    <div class="field"><div class="seg" id="pa_seg">
      <button class="on" data-k="expense">Spent</button><button data-k="saving">Saved</button></div></div>
    <div class="sheet-actions"><button class="btn ghost" onclick="closeSheet()" style="flex:.5">Cancel</button>
      <button class="btn" id="pa_add">Add</button></div>`);
  let kind='expense';
  const seg=$('#pa_seg');
  seg.querySelectorAll('button').forEach(b=>b.onclick=()=>{kind=b.dataset.k;
    seg.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b))});
  $('#pa_add').onclick=async()=>{
    const label=$('#pa_label').value.trim(),date=$('#pa_date').value;
    if(!label)return toast('Enter a description',1);
    if(!/^\d{4}-\d{2}-\d{2}$/.test(date))return toast('Pick a date',1);
    try{
      const cents=toCents($('#pa_amt').value);
      if(cents<=0)throw new Error('amount must be more than zero');
      await unwrap(sb.from('personal_entries')
        .insert({user_id:S.uid,entry_date:date,kind,label,amount_cents:cents}));
      closeSheet();toast('Added');
      if(date.slice(0,7)!==S.pmMonth)S.pmMonth=date.slice(0,7);   // follow it, don't hide it
      await loadMonthly();
    }catch(e){toast(e.message,1)}};
}
async function delPersonal(id){
  if(!confirm('Remove this entry?'))return;
  try{await unwrap(sb.from('personal_entries').delete().eq('id',id));await loadMonthly()}
  catch(e){toast(e.message,1)}
}

// ---- actions ----
async function delExpense(id){if(!confirm('Delete this expense?'))return;
  try{await unwrap(sb.from('expenses').update({deleted_at:new Date().toISOString()}).eq('id',id));
    toast('Expense deleted');await loadGroup()}catch(e){toast(e.message,1)}}
async function settle(from,to,amt){
  try{await unwrap(sb.from('settlements').insert({group_id:S.gid,from_user:from,to_user:to,amount_cents:toCents(amt)}));
    toast(`${nameOf(from)} paid ${nameOf(to)} ${money(amt)}`);await loadGroup()}catch(e){toast(e.message,1)}}

// ---- modal framework ----
const scrim=$('#scrim');
function openSheet(html){$('#sheet').innerHTML=html;scrim.classList.add('open')}
function closeSheet(){scrim.classList.remove('open')}
scrim.onclick=e=>{if(e.target===scrim)closeSheet()};

// add expense
function openAddExpense(){
  if(!S.gid){toast('Create a group first',1);return}
  if(!S.members.length){toast('Add members to this group first',1);S.tab='balances';render();return}
  const opts=S.members.map(m=>`<option value="${m.user_id}">${m.name}</option>`).join('');
  const parts=S.members.map(m=>`<label class="part">
      <input type="checkbox" class="pchk" data-uid="${m.user_id}" checked>
      <span class="grow">${m.name}</span>
      <input class="val" data-uid="${m.user_id}" type="number" step="0.01" style="display:none">
    </label>`).join('');
  openSheet(`<h3>Add expense</h3>
    <div class="field"><label>Description</label><input id="f_desc" placeholder="Dinner, taxi, groceries…"></div>
    <div class="field"><label>Amount ($)</label><input id="f_amt" type="number" step="0.01" placeholder="0.00" inputmode="decimal"></div>
    <div class="field"><label>Paid by</label><select id="f_payer">${opts}</select></div>
    <div class="field"><label>Split</label>
      <div class="seg" id="f_seg">
        <button class="on" data-t="equal">Equal</button><button data-t="exact">Exact</button>
        <button data-t="percent">%</button><button data-t="shares">Shares</button></div></div>
    <div class="field"><label id="f_plbl">Participants</label><div class="parts">${parts}</div></div>
    <div class="sheet-actions">
      <button class="btn ghost" onclick="closeSheet()" style="flex:.5">Cancel</button>
      <button class="btn" id="f_save">Add expense</button></div>`);
  let split='equal';
  const seg=$('#f_seg');
  seg.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    split=b.dataset.t;seg.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
    const show=split!=='equal';
    document.querySelectorAll('.val').forEach(i=>i.style.display=show?'block':'none');
    $('#f_plbl').textContent=split==='equal'?'Participants':split==='exact'?'Exact amounts ($)':split==='percent'?'Percentages (sum 100)':'Shares (weights)';
  });
  $('#f_save').onclick=submitExpense.bind(null,()=>split);
}
async function submitExpense(getSplit){
  const split=getSplit();
  const desc=$('#f_desc').value.trim();
  const amt=parseFloat($('#f_amt').value);
  const payer=$('#f_payer').value;
  if(!amt||amt<=0)return toast('Enter a valid amount',1);
  const chosen=[...document.querySelectorAll('.pchk')].filter(c=>c.checked).map(c=>c.dataset.uid);
  if(!chosen.length)return toast('Pick at least one participant',1);
  const body={group_id:S.gid,paid_by:payer,amount:amt.toFixed(2),split_type:split,description:desc||null};
  if(split==='equal'){body.participants=chosen}
  else{body.splits=chosen.map(uid=>({user_id:uid,value:parseFloat($(`.val[data-uid="${uid}"]`).value||'0')}))}
  try{await callFn('create_expense',body);closeSheet();toast('Expense added');await loadGroup()}
  catch(e){toast(e.message,1)}
}

// add member / new person

  const nonMembers=S.users.filter(u=>!S.members.find(m=>m.user_id===u.id));

      <div class="sec-head"><h2>or</h2></div>`:''}

      <button class="btn" id="m_create">Create & add</button></div>`);
  if(opts)$('#m_add').onclick=async()=>{try{await unwrap(sb.from('memberships').insert({group_id:S.gid,user_id:$('#m_sel').value}));
    closeSheet();toast('Member added');await refreshUsers();await loadGroup()}catch(e){toast(e.message,1)}};
  $('#m_create').onclick=async()=>{const n=$('#m_name').value.trim();if(!n)return toast('Enter a name',1);
    try{await callFn('create_shadow_member',{group_id:S.gid,name:n});
      closeSheet();toast(`${n} added`);await refreshUsers();await loadGroup()}catch(e){toast(e.message,1)}};

function openNewGroup(){
  openSheet(`<h3>New group</h3>
    <div class="field"><label>Group name</label><input id="g_name" placeholder="Trip to Goa"></div>
    <div class="field"><label>Currency</label><select id="g_cur">
      ${Object.entries(CUR).map(([c,s])=>`<option value="${c}"${c==='INR'?' selected':''}>${c} · ${s.trim()}</option>`).join('')}</select></div>
    <label class="part" style="border:0;padding:0;margin-bottom:14px"><input type="checkbox" id="g_simp" checked>
      <span class="grow">Simplify debts (fewer payments)</span></label>
    <div class="sheet-actions"><button class="btn ghost" onclick="closeSheet()" style="flex:.5">Cancel</button>
      <button class="btn" id="g_save">Create group</button></div>`);
  $('#g_save').onclick=async()=>{const n=$('#g_name').value.trim();if(!n)return toast('Enter a name',1);
    try{
      const g=await unwrap(sb.rpc('create_group_with_owner',
        {p_name:n,p_currency:$('#g_cur').value,p_simplify:$('#g_simp').checked}));
      S.groups.push({id:g.id,name:g.name,created_by:g.created_by});S.gid=g.id;
      $('#groupSel').innerHTML=S.groups.map(x=>`<option value="${x.id}">${x.name}</option>`).join('')+'<option value="__new">＋ New group</option>';
      $('#groupSel').value=g.id;closeSheet();toast('Group created');await loadGroup()}catch(e){toast(e.message,1)}};
}
async function refreshUsers(){S.users=await unwrap(sb.from('profiles').select('id,name,avatar_emoji').order('name'))}

async function detectProviders(){
  try{
    // Bounded: a request that hangs rather than fails would otherwise sit
    // here forever. try/catch only covers rejection, not never-settling.
    const r=await fetch(`${SUPABASE_URL}/auth/v1/settings`,
      {headers:{apikey:SUPABASE_ANON_KEY},
       signal:AbortSignal.timeout?AbortSignal.timeout(5000):undefined});
    GOOGLE_ON=!!((await r.json()).external||{}).google;
  }catch{}                                  // offline / slow / blocked: hide it
}

// Returning from Google, supabase-js exchanges the code for a session
// asynchronously, so boot()'s getSession() can run first and find nothing.
// Boot again when the session lands -- but only while the login screen is
// actually showing, otherwise restoring a session on a normal page load
// would fire this and run boot() a second time.
sb.auth.onAuthStateChange(e=>{
  if(e==='SIGNED_IN'&&!S.uid&&!$('#authScreen').hidden)boot();
});

// Start the app immediately. Provider detection must NOT gate this: it is a
// network call, and one that hangs instead of failing would leave boot()
// never run -- the signed-in shell with no name, no groups and no error,
// which is exactly what a weak mobile connection produced.
boot().catch(e=>{$('#view').innerHTML=`<div class="empty">Failed to load: ${e.message}</div>`});

// Runs alongside. If the answer lands after the login screen is already
// drawn, redraw it so the Google button appears; otherwise it just stays
// hidden, which is the safe default.
detectProviders().then(()=>{
  if(GOOGLE_ON&&!$('#authScreen').hidden)showAuth(authMode);
});

// Makes the app installable. Registered after load so it never competes with
// the first paint or boot()'s requests, and swallowed on failure -- a worker
// that won't register (private mode, insecure origin, blocked) must not take
// the app down with it. See sw.js for why it is network-first.
if('serviceWorker' in navigator)
  addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
